description: Ubeya is an AI-powered workforce management platform for businesses that
  rely on hourly and temporary workers, including staffing agencies, stadiums, events,
  hospitality, catering, healthcare, and retail operations. The platform covers scheduling,
  time and attendance, communication, payroll, compliance, reporting, CRM, vendor
  management, and a worker app, and integrates with ATS, CRM, payroll, and billing
  systems as well as Zapier and a customer-facing OpenAPI for programmatic data access.
